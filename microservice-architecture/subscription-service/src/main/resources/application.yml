server:
  port: 8087

spring:
  application:
    name: SUBSCRIPTION-SERVICE
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:hireconnect.platform@gmail.com}
    password: ${MAIL_PASSWORD:pdpjkuadodvspuyl}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            trust: smtp.gmail.com
    default-encoding: UTF-8
  datasource:
    url: jdbc:mysql://localhost:3306/hireconnect_subscriptions?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Razorpay Credentials — replace with your actual test keys from razorpay.com
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}

